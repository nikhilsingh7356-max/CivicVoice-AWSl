AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: CivicVoice AI - AWS Ship It MVP

Parameters:

  BedrockModelId:
    Type: String
    Default: global.anthropic.claude-sonnet-4-5-20250929-v1:0

  AlertEmail:
    Type: String
    Default: ''

  FrontendUrl:
    Type: String
    Default: http://localhost:3000
    Description: >
      Public URL of the CivicVoice SPA. The Cognito app client will accept
      <FrontendUrl>/auth/callback as its OAuth callback and <FrontendUrl>
      as its logout URL.

  CognitoDomainName:
    Type: String
    Default: civicvoice-auth
    Description: >
      Subdomain prefix for the Cognito hosted UI domain
      (<value>.auth.<region>.amazoncognito.com). Must be unique in the region.

  FrontendAllowedOrigins:
    Type: String
    Default: https://main.d3b8da5vp73lda.amplifyapp.com
    Description: >
      Comma-separated list of origins allowed to call the CivicVoice API
      (Access-Control-Allow-Origin). Served as the FRONTEND_ALLOWED_ORIGINS
      env var to the Lambda. Localhost/127.0.0.1 origins are always allowed
      for local development; OPTIONS preflight is handled inside the Lambda.

Conditions:

  CreateAlertSubscription: !Not
    - !Equals
      - !Ref AlertEmail
      - ''

Resources:

  # ============================================================
  # DYNAMODB - MAIN CIVIC CASES
  # ============================================================

  CasesTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: CivicVoiceCases
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S

      KeySchema:
        - AttributeName: case_id
          KeyType: HASH

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true


  # ============================================================
  # DYNAMODB - APPEND-ONLY CASE HISTORY
  # ============================================================

  CaseHistoryTable:
    Type: AWS::DynamoDB::Table

    Properties:
      TableName: CivicVoiceCaseHistory
      BillingMode: PAY_PER_REQUEST

      AttributeDefinitions:
        - AttributeName: case_id
          AttributeType: S

        - AttributeName: timestamp_event_id
          AttributeType: S

      KeySchema:
        - AttributeName: case_id
          KeyType: HASH

        - AttributeName: timestamp_event_id
          KeyType: RANGE

      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true


  # ============================================================
  # S3 - PRIVATE EVIDENCE STORAGE
  # ============================================================

  EvidenceBucket:
    Type: AWS::S3::Bucket

    Properties:

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

      VersioningConfiguration:
        Status: Enabled


  # ============================================================
  # EVENTBRIDGE - CIVICVOICE CUSTOM EVENT BUS
  # ============================================================

  CivicVoiceEventBus:
    Type: AWS::Events::EventBus

    Properties:
      Name: CivicVoiceEventBus


  # ============================================================
  # SNS - OFFICER ALERT TOPIC
  # ============================================================

  CivicVoiceSnsTopic:
    Type: AWS::SNS::Topic

    Properties:
      TopicName: CivicVoiceCriticalAlerts


  # ============================================================
  # SNS TOPIC POLICY
  # ============================================================

  CivicVoiceSnsTopicPolicy:
    Type: AWS::SNS::TopicPolicy

    Properties:

      Topics:
        - !Ref CivicVoiceSnsTopic

      PolicyDocument:

        Version: '2012-10-17'

        Statement:

          - Sid: EventBridgePublishCriticalAlerts
            Effect: Allow

            Principal:
              Service:
                - events.amazonaws.com

            Action:
              - sns:Publish

            Resource: !Ref CivicVoiceSnsTopic

            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId


  # ============================================================
  # SNS EMAIL SUBSCRIPTION
  # ============================================================

  CivicVoiceAlertSubscription:
    Type: AWS::SNS::Subscription

    Condition: CreateAlertSubscription

    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref CivicVoiceSnsTopic


  # ============================================================
  # EVENTBRIDGE RULE
  # HIGH AND CRITICAL CASES GENERATE OFFICER ALERTS
  # ============================================================

  CivicVoiceCriticalCaseRule:
    Type: AWS::Events::Rule

    DependsOn:
      - CivicVoiceSnsTopicPolicy

    Properties:

      Name: CivicVoiceCriticalCaseRule

      EventBusName: !Ref CivicVoiceEventBus

      State: ENABLED

      EventPattern:

        source:
          - civicvoice

        detail-type:
          - CivicCaseCreated

        detail:

          priority:
            - CRITICAL
            - HIGH

      Targets:

        - Arn: !Ref CivicVoiceSnsTopic
          Id: CivicVoiceCriticalSnsTarget


  # ============================================================
  # API GATEWAY
  # ============================================================

  CivicVoiceApi:
    Type: AWS::Serverless::Api

    Properties:
      StageName: Prod


  # ============================================================
  # MAIN CIVICVOICE LAMBDA
  # ============================================================

  ApiFunction:
    Type: AWS::Serverless::Function

    Metadata:
      BuildMethod: esbuild

      BuildProperties:
        EntryPoints:
          - lambda.ts

        Minify: true

        Target: es2022

        Sourcemap: true

        Format: cjs

        External:
          - vite
          - esbuild

    Properties:

      Runtime: nodejs22.x

      Handler: lambda.handler

      CodeUri: .

      MemorySize: 1024

      Timeout: 60

      # --------------------------------------------------------
      # ENVIRONMENT VARIABLES
      # --------------------------------------------------------

      Environment:

        Variables:

          CASES_TABLE: !Ref CasesTable

          CASE_HISTORY_TABLE: !Ref CaseHistoryTable

          MEDIA_BUCKET: !Ref EvidenceBucket

          BEDROCK_MODEL_ID: !Ref BedrockModelId

          EVENT_BUS_NAME: !Ref CivicVoiceEventBus

          FRONTEND_ALLOWED_ORIGINS: !Ref FrontendAllowedOrigins


      # --------------------------------------------------------
      # IAM PERMISSIONS
      # --------------------------------------------------------

      Policies:

        # Main case table
        - DynamoDBCrudPolicy:
            TableName: !Ref CasesTable


        # Append-only audit history
        - Statement:

            - Effect: Allow

              Action:
                - dynamodb:PutItem
                - dynamodb:Query

              Resource: !GetAtt CaseHistoryTable.Arn


        # S3 evidence bucket
        - S3CrudPolicy:
            BucketName: !Ref EvidenceBucket


        # Amazon Bedrock
        - Statement:

            - Effect: Allow

              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream

              Resource: '*'


        # Amazon Transcribe
        - Statement:

            - Effect: Allow

              Action:
                - transcribe:StartTranscriptionJob
                - transcribe:GetTranscriptionJob

              Resource: '*'


        # EventBridge
        - Statement:

            - Effect: Allow

              Action:
                - events:PutEvents

              Resource: !GetAtt CivicVoiceEventBus.Arn


        # CloudWatch custom metrics
        - Statement:

            - Effect: Allow

              Action:
                - cloudwatch:PutMetricData

              Resource: '*'


      # ========================================================
      # API GATEWAY EVENT
      # ========================================================

      Events:

        Api:

          Type: Api

          Properties:

            RestApiId: !Ref CivicVoiceApi

            Path: /{proxy+}

            Method: ANY


  # ============================================================
  # CLOUDWATCH - LAMBDA ERROR ALARM
  # ============================================================

  CivicVoiceLambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: CivicVoiceLambdaErrorsAlarm

      AlarmDescription: >
        Alerts when the CivicVoice API Lambda reports
        any error in a 5-minute window.

      Namespace: AWS/Lambda

      MetricName: Errors

      Dimensions:

        - Name: FunctionName
          Value: !Ref ApiFunction

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching


  # ============================================================
  # CLOUDWATCH - EVENTBRIDGE FAILURE ALARM
  # ============================================================

  CivicVoiceEventBridgePublishFailuresAlarm:
    Type: AWS::CloudWatch::Alarm

    Properties:

      AlarmName: CivicVoiceEventBridgePublishFailuresAlarm

      AlarmDescription: >
        Alerts when CivicVoice fails to publish a
        CivicCaseCreated event to EventBridge
        in a 5-minute window.

      Namespace: CivicVoice

      MetricName: EventBridgePublishFailures

      Statistic: Sum

      Period: 300

      EvaluationPeriods: 1

      Threshold: 1

      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching


  # ============================================================
  # COGNITO - USER POOL (AUTHENTICATION)
  # ============================================================

  CivicVoiceUserPool:
    Type: AWS::Cognito::UserPool

    Properties:
      UserPoolName: civicvoice-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'

      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true

      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
        UnusedAccountValidityDays: 7

      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false


  # ------------------------------------------------------------
  # APP CLIENT - PUBLIC SPA (HOSTED UI + PKCE, no secret)
  # ------------------------------------------------------------

  CivicVoiceUserPoolClient:
    Type: AWS::Cognito::UserPoolClient

    Properties:
      UserPoolId: !Ref CivicVoiceUserPool
      ClientName: civicvoice-web
      GenerateSecret: false
      RefreshTokenValidity: 30
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - !Sub '${FrontendUrl}/auth/callback'
      LogoutURLs:
        - !Ref FrontendUrl
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile


  # ------------------------------------------------------------
  # HOSTED UI DOMAIN
  # ------------------------------------------------------------

  CivicVoiceUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain

    Properties:
      Domain: !Ref CognitoDomainName
      UserPoolId: !Ref CivicVoiceUserPool


# ==============================================================
# OUTPUTS
# ==============================================================

Outputs:

  # ------------------------------------------------------------
  # API GATEWAY URL
  # ------------------------------------------------------------

  ApiUrl:

    Description: CivicVoice API Gateway URL

    Value: !Sub
      - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/Prod/
      - ApiId: !Ref CivicVoiceApi


  # ------------------------------------------------------------
  # S3 EVIDENCE BUCKET
  # ------------------------------------------------------------

  EvidenceBucket:

    Description: >
      S3 bucket used for CivicVoice evidence

    Value: !Ref EvidenceBucket


  # ------------------------------------------------------------
  # MAIN DYNAMODB TABLE
  # ------------------------------------------------------------

  CasesTable:

    Description: >
      DynamoDB table containing CivicVoice cases

    Value: !Ref CasesTable


  # ------------------------------------------------------------
  # AUDIT HISTORY TABLE
  # ------------------------------------------------------------

  CaseHistoryTable:

    Description: >
      Append-only DynamoDB table containing
      the CivicVoice case audit trail

    Value: !Ref CaseHistoryTable


  # ------------------------------------------------------------
  # EVENTBRIDGE BUS
  # ------------------------------------------------------------

  CivicVoiceEventBus:

    Description: >
      CivicVoice custom EventBridge bus

    Value: !Ref CivicVoiceEventBus


  # ------------------------------------------------------------
  # EVENTBRIDGE BUS ARN
  # ------------------------------------------------------------

  CivicVoiceEventBusArn:

    Description: >
      ARN of the CivicVoice EventBridge bus

    Value: !GetAtt CivicVoiceEventBus.Arn


  # ------------------------------------------------------------
  # SNS ALERT TOPIC
  # ------------------------------------------------------------

  CivicVoiceSnsTopic:

    Description: >
      SNS topic for critical CivicVoice officer alerts

    Value: !Ref CivicVoiceSnsTopic


  # ------------------------------------------------------------
  # COGNITO USER POOL
  # ------------------------------------------------------------

  CivicVoiceUserPoolId:

    Description: >
      ID of the CivicVoice Cognito user pool (for VITE_COGNITO_USER_POOL_ID)

    Value: !Ref CivicVoiceUserPool


  # ------------------------------------------------------------
  # COGNITO APP CLIENT
  # ------------------------------------------------------------

  CivicVoiceUserPoolClientId:

    Description: >
      App client ID for the CivicVoice web app (for VITE_COGNITO_CLIENT_ID)

    Value: !Ref CivicVoiceUserPoolClient


  # ------------------------------------------------------------
  # COGNITO HOSTED UI DOMAIN
  # ------------------------------------------------------------

  CivicVoiceHostedUIDomain:

    Description: >
      Full Cognito hosted UI domain (for VITE_COGNITO_DOMAIN)

    Value: !Sub '${CognitoDomainName}.auth.${AWS::Region}.amazoncognito.com'